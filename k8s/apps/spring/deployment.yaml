apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-log-app
  namespace: log-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-log-app
  template:
    metadata:
      labels:
        app: spring-log-app
    spec:
      containers:
        - name: spring-log-app
          image: wo9697/spring-log-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spring-log-app
  namespace: log-pipeline
spec:
  selector:
    app: spring-log-app
  ports:
    - port: 8080
      targetPort: 8080
